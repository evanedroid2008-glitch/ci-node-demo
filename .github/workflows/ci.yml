name: Build, publish, and deploy Docker image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test application
        run: |
          npm run build
          npm test
          node --check index.js

      - name: Validate Dockerfile on pull requests
        if: github.event_name == 'pull_request'
        run: docker build -t local/nodeapp:pull-request .

  publish:
    name: Build and push Docker Hub image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.tags.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate branch and commit tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch_tag="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          if [ -z "$branch_tag" ]; then branch_tag=branch; fi
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "branch=$branch_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push branch and commit tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.tags.outputs.branch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy with Docker Compose to EC2
    needs: [test, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH connection
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY_B64"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$POSTGRES_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose files and deployment environment to EC2
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/ec2_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" 'mkdir -p "$HOME/nodeapp"'
          scp "${SSH_OPTS[@]}" docker-compose.yml scripts/deploy-ec2.sh scripts/install-docker-ec2.sh "$EC2_USER@$EC2_HOST:nodeapp/"
          env_file="$RUNNER_TEMP/nodeapp.env"
          printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG" "$POSTGRES_PASSWORD" > "$env_file"
          chmod 600 "$env_file"
          scp "${SSH_OPTS[@]}" "$env_file" "$EC2_USER@$EC2_HOST:nodeapp/.env"
          rm -f "$env_file"

      - name: Install Docker Engine and Compose on EC2
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/ec2_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" 'bash ~/nodeapp/install-docker-ec2.sh'

      - name: Authenticate EC2 to Docker Hub
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/ec2_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" "sudo -n docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Remove old PM2 app and deploy Compose services
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/ec2_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" 'bash ~/nodeapp/deploy-ec2.sh'
